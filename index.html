
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Toolkit Pro</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }
    </script>
</head>
<body>
    <header>
        <h1>PDF Toolkit</h1>
        <p>Merge PDFs 100% Offline</p>
    </header>

    <main>
        <div class="upload-box" id="drop-zone">
            <p>Tap to select PDF files</p>
            <input type="file" id="file-input" accept="application/pdf" multiple hidden>
        </div>

        <div id="file-list" class="file-list"></div>

        <div class="actions">
            <button id="merge-btn" disabled>Merge PDFs</button>
            <button id="download-btn" disabled style="display:none;">Download Merged PDF</button>
        </div>
        
        <div id="ad-banner" class="ad-banner">Ad Space (Will appear here)</div>
    </main>

    <!-- The magic PDF library -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="app.js"></script>
    
    <!-- Adsterra Ad Code -->
    <script data-cfasync="false" src="https://bauval.org/14/d22ee4424d3512060eea479eaed6c028"></script>
</body>
</html>
